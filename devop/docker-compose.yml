services:
  app:
    container_name: drakestrin_app
    image: devop-app
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../:/var/www/html
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent
    environment:
      SSH_AUTH_SOCK: /ssh-agent
    ports:
      - 80:80
    depends_on:
      - db
      - mailpit
    secrets:
      - ssh_key
  scheduler:
    image: devop-app
    command: php artisan schedule:work
    working_dir: /var/www/html
    volumes:
      - ../:/var/www/html
    depends_on:
      - db
      - mailpit
  browser-sync:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "test -d node_modules/browser-sync || npm ci; npm run watch"
    environment:
      BROWSERSYNC_PROXY: http://app
    volumes:
      - ../:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports:
      - 3000:3000
    depends_on:
      - app
  db:
    container_name: drakestrin_db
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - 3306:3306
    volumes:
      - mysql_data:/var/lib/mysql
  adminer:
    image: adminer
    restart: always
    ports:
      - ${ADMINER_PORT:-8081}:8080
  db-test:
    image: mysql:8.4
    profiles: [testing]
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
      MYSQL_DATABASE: drakestrin_testing
      MYSQL_USER: drakestrin_testing
      MYSQL_PASSWORD: local-testing-only
    volumes:
      - mysql_test_data:/var/lib/mysql
      - ./database/usr_l3s658_1.sql:/docker-entrypoint-initdb.d/legacy.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$MYSQL_PASSWORD mysql --user=$$MYSQL_USER --database=$$MYSQL_DATABASE --execute="SELECT 1 FROM dra_user LIMIT 1" >/dev/null 2>&1 || MYSQL_PWD=$$MYSQL_PASSWORD mysql --user=$$MYSQL_USER --database=$$MYSQL_DATABASE --execute="SELECT 1 FROM users LIMIT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 120
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - ${MAILPIT_PORT:-8025}:8025

volumes:
  mysql_data:
  node_modules:
  mysql_test_data:

secrets:
  ssh_key:
    file: "${SSH_KEY}"
