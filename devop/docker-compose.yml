services:
  app:
    container_name: drakestrin_app
    image: devop-app
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../:/var/www/html
    ports:
      - 80:80
    depends_on:
      - db
    secrets:
      - ssh_key
  scheduler:
    image: devop-app
    command: php artisan schedule:work
    working_dir: /var/www/html
    volumes:
      - ../:/var/www/html
    depends_on:
      - db
  browser-sync:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "test -d node_modules/browser-sync || npm ci; npm run watch"
    environment:
      BROWSERSYNC_PROXY: http://app
    volumes:
      - ../:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports:
      - 3000:3000
    depends_on:
      - app
  db:
    container_name: drakestrin_db
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - 3306:3306
    volumes:
      - mysql_data:/var/lib/mysql
  adminer:
    image: adminer
    restart: always
    ports:
      - ${ADMINER_PORT:-8081}:8080

volumes:
  mysql_data:
  node_modules:

secrets:
  ssh_key:
    file: "${SSH_KEY}"
